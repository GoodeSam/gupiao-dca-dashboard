name: update-data

on:
  schedule:
    # 每月 10 日 10:00 UTC(北京 18:00)。取 10 日是为了保证当月首个交易日
    # 已经过去(A 股国庆后首个交易日可迟至 8 日)。
    - cron: "0 10 10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 测试必须全绿才允许更新数据
        run: python -m pytest tests/ -q
      - name: 拉取数据并重算
        run: python -m dashboard.fetch_and_compute
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: 月度数据更新 $(date -u +%F)"
          git push
