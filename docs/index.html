<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定投看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19;
      --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#e66767;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    max-width:1060px; margin:0 auto; padding:28px 20px 48px;
  }
  h1 { font-size:22px; font-weight:650; }
  .sub { color:var(--ink-2); font-size:13px; margin-top:6px; line-height:1.6; }
  .caveat { color:var(--muted); font-size:12px; margin-top:4px; }
  .error { color:var(--down); font-size:13px; margin-top:10px; }
  .controls { display:flex; align-items:center; gap:10px; margin:18px 0 0;
              font-size:13px; color:var(--ink-2); flex-wrap:wrap; }
  select, input[type="month"] {
    font:inherit; font-size:13px; color:var(--ink);
    background:var(--surface); border:1px solid var(--grid); border-radius:7px;
    padding:4px 8px;
  }
  input[type="month"].custom { border-color:var(--s1); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
           gap:12px; margin:16px 0 22px; }
  .tile { background:var(--surface); border:1px solid var(--ring); border-radius:10px;
          padding:14px 16px; }
  .tile .name { font-size:13px; color:var(--ink-2); }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }
  .tile .ret { font-size:26px; font-weight:650; margin-top:6px; }
  .tile .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .card { background:var(--surface); border:1px solid var(--ring); border-radius:10px;
          padding:18px; margin:14px 0; }
  .card h2 { font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { font-size:12px; padding:4px 11px; border-radius:999px;
          border:1px solid var(--grid); background:transparent; color:var(--ink-2);
          cursor:pointer; display:inline-flex; align-items:center; gap:6px;
          font-family:inherit; }
  .chip:hover { border-color:var(--baseline); }
  .chip.on { color:var(--ink); border-color:var(--baseline); font-weight:600; }
  .chart-wrap { position:relative; height:390px; }
  .tbl-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px;
          font-variant-numeric:tabular-nums; white-space:nowrap; }
  th { text-align:right; font-weight:600; color:var(--muted); font-size:12px;
       padding:7px 12px; border-bottom:1px solid var(--grid); }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:8px 12px; border-bottom:1px solid var(--grid); }
  tr:last-child td { border-bottom:none; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; line-height:1.7; }
</style>
</head>
<body>
<h1>定投看板</h1>
<p class="sub" id="params">加载中…</p>
<p class="caveat">口径:复权收盘价(价格总回报近似)、允许碎股、零费用;美元/港币标的按当日
汇率换算。数据仅供研究,非投资建议。</p>
<p class="error" id="error" hidden></p>

<div class="controls">
  <label for="sort">排序</label>
  <select id="sort">
    <option value="default">默认顺序</option>
    <option value="xirr_desc">年化收益率 高→低</option>
    <option value="xirr_asc">年化收益率 低→高</option>
    <option value="cum_desc">累计收益率 高→低</option>
    <option value="cum_asc">累计收益率 低→高</option>
    <option value="value_desc">当前市值 高→低</option>
  </select>
  <span class="caveat">起投月可在下方明细表逐只修改,改后全页即时重算</span>
</div>

<div class="tiles" id="tiles"></div>

<div class="card">
  <h2>持仓市值走势(人民币)</h2>
  <p class="caveat">点击标的名切换显示;颜色可辨识的上限是同时 5 条线,选第 6 只时会替换最早选中的。默认显示当前市值最大的 5 只。</p>
  <div class="chips" id="chips"></div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>

<div class="card">
  <h2>明细(起投月可修改,蓝框表示已自定义)</h2>
  <div class="tbl-wrap"><table id="tbl">
    <thead><tr><th>标的</th><th>币种</th><th>起投月</th><th>定投月数</th><th>累计投入</th>
    <th>当前市值</th><th>累计收益率</th><th>年化(XIRR)</th><th>数据截至</th></tr></thead>
    <tbody></tbody>
  </table></div>
</div>

<footer id="foot"></footer>

<script>
const COLOR_SLOTS = ['--s1','--s2','--s3','--s4','--s5'];
const CHART_MAX_SERIES = COLOR_SLOTS.length;  // 超出调色板槽位数会不可辨识
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cny = v => Number.isFinite(v) ? '¥' + Math.round(v).toLocaleString('zh-CN') : '—';
const pct = v => Number.isFinite(v)
  ? (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%' : '—';
const cls = v => Number.isFinite(v) ? (v >= 0 ? 'up' : 'down') : '';
const monthOf = iso => iso.slice(0, 7);

let chart = null;
let baseStocks = [];          // data.json 原始(全区间)结果
let meta = null;              // params / generated_at
const customStart = {};       // symbol -> 'YYYY-MM'(用户自定义起投月)
let sortMode = 'default';
let selection = [];           // 走势图选中的 symbol,按选中顺序
const slotBySymbol = {};      // 颜色跟随标的,选中期间不变

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = el.hidden ? msg : el.textContent + ' ' + msg;
  el.hidden = false;
}

// ---------- 前端重算:任意起投月的子区间 ----------
// 原理:series[k] 是第 k 次买入后的市值,shares_series[k] 是当时的累计份额,
// 两者之比即当日"单位份额价格(CNY)"。从起投月 m 开始的组合 = 总份额减去 m 之前
// 的份额,再乘各日单位价——与后端全量重算数学上等价。
function jsXirr(flows) {
  if (new Set(flows.map(f => f[0])).size < 2) return null;
  const t0 = Date.parse(flows[0][0]);
  const yrs = f => (Date.parse(f[0]) - t0) / (365 * 864e5);
  const npv = r => flows.reduce((a, f) => a + f[1] / Math.pow(1 + r, yrs(f)), 0);
  // 短区间高收益的年化可以远超 1000%,上界自适应扩张直到变号
  let lo = -0.9999, hi = 10;
  while (npv(lo) * npv(hi) > 0 && hi < 1e9) hi *= 2;
  if (npv(lo) * npv(hi) > 0) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    if (npv(lo) * npv(mid) <= 0) hi = mid; else lo = mid;
  }
  return (lo + hi) / 2;
}

// 每只标的的首/末买入月与子区间重算资格(series 与 shares_series 必须逐日对齐)
const stockBySym = new Map();
const firstBuyMonth = s => s.series.length ? monthOf(s.series[0][0]) : null;
const lastBuyMonth = s => s.series.length ? monthOf(s.series[s.series.length - 1][0]) : null;
function customOk(s) {
  return Array.isArray(s.series) && Array.isArray(s.shares_series)
    && s.series.length === s.shares_series.length && s.series.length > 0
    && s.series.every((p, i) => s.shares_series[i][0] === p[0]
         && Number.isFinite(s.shares_series[i][1]) && s.shares_series[i][1] > 0);
}

function effectiveStock(s) {
  const cs = customStart[s.symbol];
  const firstMonth = firstBuyMonth(s);
  if (!cs || !firstMonth || cs <= firstMonth || !customOk(s)) return s;

  const monthly = meta.params.monthly_cny;
  const buys = s.series.map((p, i) => ({ d: p[0], v: p[1], cum: s.shares_series[i][1] }));
  const kept = buys.filter(b => monthOf(b.d) >= cs);
  if (kept.length === 0) {
    return { ...s, months: 0, invested: 0, value_cny: NaN, cum_return: NaN,
             xirr: null, series: [], invested_series: [] };
  }
  const prevCum = buys[buys.length - kept.length - 1].cum;
  const totalCum = buys[buys.length - 1].cum;
  const invested = monthly * kept.length;
  const value = s.value_cny * (totalCum - prevCum) / totalCum;
  const series = kept.map(b => [b.d, (b.cum - prevCum) * (b.v / b.cum)]);
  const flows = kept.map(b => [b.d, -monthly]);
  flows.push([s.as_of, value]);
  return { ...s, months: kept.length, invested,
           value_cny: value, cum_return: value / invested - 1,
           xirr: jsXirr(flows), series,
           invested_series: kept.map((b, i) => [b.d, monthly * (i + 1)]) };
}

function viewStocks() {
  const arr = baseStocks.map(effectiveStock);
  const keys = {
    xirr_desc:  s => -(s.xirr ?? -1e9),
    xirr_asc:   s => (s.xirr ?? 1e9),
    cum_desc:   s => -(Number.isFinite(s.cum_return) ? s.cum_return : -1e9),
    cum_asc:    s => (Number.isFinite(s.cum_return) ? s.cum_return : 1e9),
    value_desc: s => -(Number.isFinite(s.value_cny) ? s.value_cny : 0),
  };
  const key = keys[sortMode];
  if (key) arr.sort((a, b) => key(a) - key(b));
  return arr;
}

// ---------- 渲染 ----------
function renderHeader() {
  document.title = `定投看板 · 每月${meta.params.monthly_cny}元`;
  document.getElementById('params').textContent =
    `每月首个交易日定投 ¥${meta.params.monthly_cny},默认起点 ${meta.params.start}` +
    `(可逐只自定义)`;
  document.getElementById('foot').textContent =
    `数据生成于 ${meta.generated_at.replace('T', ' ').replace('+00:00', ' UTC')};` +
    `由 GitHub Actions 每月自动更新。标的清单见仓库 config/tickers.json。`;
}

function renderTiles(stocks) {
  document.getElementById('tiles').innerHTML = stocks.map(s => `
    <div class="tile">
      <div class="name">${esc(s.name)}
        <span style="color:var(--muted)">${esc(s.symbol)}</span></div>
      <div class="ret ${cls(s.cum_return)}">${pct(s.cum_return)}</div>
      <div class="meta">年化 ${pct(s.xirr)} · 市值 ${cny(s.value_cny)}</div>
    </div>`).join('');
}

function renderTable(stocks) {
  document.querySelector('#tbl tbody').innerHTML = stocks.map(s => {
    const base = stockBySym.get(s.symbol);
    const firstMonth = firstBuyMonth(base);
    const val = customStart[s.symbol] ?? firstMonth ?? '';
    const inp = (firstMonth && customOk(base))
      ? `<input type="month" class="start-inp${customStart[s.symbol] ? ' custom' : ''}"
           data-sym="${esc(s.symbol)}" value="${esc(val)}"
           min="${esc(firstMonth)}" max="${esc(lastBuyMonth(base))}">`
      : '—';
    return `
    <tr><td>${esc(s.name)} ${esc(s.symbol)}</td><td>${esc(s.currency)}</td>
    <td>${inp}</td>
    <td>${s.months}</td><td>${cny(s.invested)}</td><td>${cny(s.value_cny)}</td>
    <td class="${cls(s.cum_return)}">${pct(s.cum_return)}</td>
    <td class="${cls(s.xirr)}">${pct(s.xirr)}</td><td>${esc(s.as_of ?? '—')}</td></tr>`;
  }).join('');
}

function freeSlot() {
  const used = new Set(Object.values(slotBySymbol));
  return COLOR_SLOTS.findIndex((_, i) => !used.has(i));
}

function toggleStock(sym) {
  if (selection.includes(sym)) {
    selection = selection.filter(s => s !== sym);
    delete slotBySymbol[sym];
  } else {
    if (selection.length >= CHART_MAX_SERIES) {
      delete slotBySymbol[selection.shift()];  // 替换最早选中的
    }
    slotBySymbol[sym] = freeSlot();
    selection.push(sym);
  }
  const v = viewStocks();
  renderChips(v);
  redrawChart(v);
}

function renderChips(stocks) {
  document.getElementById('chips').innerHTML = stocks.map(s => {
    const on = selection.includes(s.symbol);
    const dot = on ? `<span class="dot" style="background:var(${COLOR_SLOTS[slotBySymbol[s.symbol]]})"></span>` : '';
    return `<button class="chip${on ? ' on' : ''}" data-sym="${esc(s.symbol)}">${dot}${esc(s.name)}</button>`;
  }).join('');
}

function redrawChart(stocks) {
  if (chart) { chart.destroy(); chart = null; }
  if (typeof Chart === 'undefined') return;
  const shown = selection.map(sym => stocks.find(s => s.symbol === sym))
    .filter(s => s && s.series.length > 0);
  if (shown.length > 0) drawChart(shown);
}

function buildChartModel(stocks) {
  // 每只标的:买入日快照 + 用 as_of 当月的最新市值收尾,保证图表终点 = 汇总市值
  const valueMaps = stocks.map(s => {
    const m = Object.fromEntries(s.series.map(p => [monthOf(p[0]), p[1]]));
    if (s.as_of != null && Number.isFinite(s.value_cny)) m[monthOf(s.as_of)] = s.value_cny;
    return m;
  });
  const months = [...new Set(valueMaps.flatMap(m => Object.keys(m)))].sort();
  // 累计投入基线只在所有选中标的的投入日程完全一致时才有意义;
  // 起投月各不相同时,一条共享基线会误导除一只以外的所有标的
  const schedules = stocks.map(s => JSON.stringify(s.invested_series.map(p => monthOf(p[0]))));
  let invested = null;
  if (schedules.length > 0 && schedules.every(x => x === schedules[0])) {
    const invMap = Object.fromEntries(stocks[0].invested_series.map(p => [monthOf(p[0]), p[1]]));
    let last = null;
    invested = months.map(k => (invMap[k] != null ? (last = invMap[k]) : last));
  }
  return { months, values: valueMaps.map(m => months.map(k => m[k] ?? null)), invested };
}

function drawChart(stocks) {
  const { months, values, invested } = buildChartModel(stocks);
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: months,
      datasets: [
        ...stocks.map((s, i) => ({
          label: s.name, data: values[i],
          borderColor: css(COLOR_SLOTS[slotBySymbol[s.symbol] ?? i % COLOR_SLOTS.length]),
          backgroundColor: css(COLOR_SLOTS[slotBySymbol[s.symbol] ?? i % COLOR_SLOTS.length]),
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 12,
          spanGaps: true, tension: 0.1,
        })),
        ...(invested ? [{
          label: '累计投入', data: invested,
          borderColor: css('--baseline'), backgroundColor: css('--baseline'),
          borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 0,
          spanGaps: true,
        }] : []),
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: css('--ink-2'), usePointStyle: true,
                            pointStyle: 'line', boxHeight: 2 } },
        tooltip: {
          callbacks: { label: c => ` ${c.dataset.label}: ${cny(c.parsed.y)}` },
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
        },
      },
      scales: {
        x: { ticks: { color: css('--muted'), maxTicksLimit: 12, maxRotation: 0 },
             grid: { display: false }, border: { color: css('--baseline') } },
        y: { ticks: { color: css('--muted'), callback: v => cny(v) },
             grid: { color: css('--grid') }, border: { display: false } },
      },
    },
  });
}

function renderAll({ chart: withChart = true } = {}) {
  const v = viewStocks();
  // 自定义起投后 series 变空的选中项要让出颜色槽,避免占位却不显示
  const emptied = selection.filter(sym => {
    const s = v.find(x => x.symbol === sym);
    return !s || s.series.length === 0;
  });
  emptied.forEach(sym => { delete slotBySymbol[sym]; });
  selection = selection.filter(sym => !emptied.includes(sym));

  renderTiles(v);
  renderTable(v);
  renderChips(v);
  if (withChart) redrawChart(v);
}

// ---------- 启动 ----------
async function main() {
  const resp = await fetch('data.json?t=' + Date.now());
  if (!resp.ok) throw new Error(`data.json 加载失败(HTTP ${resp.status})`);
  const data = await resp.json();
  if (!Array.isArray(data.stocks) || !data.params) throw new Error('data.json 结构不符合预期');
  baseStocks = data.stocks;
  meta = data;
  baseStocks.forEach(s => stockBySym.set(s.symbol, s));
  // 子区间重算依赖 series/shares_series 逐日对齐;不满足的标的仍正常展示,
  // 只是禁用起投月编辑(customOk 在渲染与重算两处同源把关)
  const badCustom = baseStocks.filter(s => s.series.length > 0 && !customOk(s));
  if (badCustom.length > 0) {
    showError('以下标的的份额序列与市值序列不对齐,已禁用其起投月自定义:' +
      badCustom.map(s => s.symbol).join('、'));
  }

  if (baseStocks.length === 0) {
    document.getElementById('params').textContent = '没有配置任何标的';
    showError('标的清单为空:请在仓库 config/tickers.json 中添加股票后重新生成数据。');
    return;
  }
  if (Array.isArray(data.failed) && data.failed.length > 0) {
    showError('以下标的本次取数失败,未纳入统计:' +
      data.failed.map(f => `${f.name} ${f.symbol}(${f.error})`).join(';'));
  }

  renderHeader();
  if (typeof Chart === 'undefined') {
    showError('图表库(CDN)加载失败,已跳过走势图;卡片与数据表不受影响。');
  }
  // 默认选中市值前 5
  [...baseStocks].sort((a, b) => b.value_cny - a.value_cny)
    .slice(0, CHART_MAX_SERIES)
    .forEach(s => { slotBySymbol[s.symbol] = freeSlot(); selection.push(s.symbol); });
  renderAll();

  document.getElementById('sort').addEventListener('change', e => {
    sortMode = e.target.value;
    renderAll({ chart: false });  // 排序不影响图表内容,不必重建
  });
  document.getElementById('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) toggleStock(chip.dataset.sym);
  });
  document.querySelector('#tbl tbody').addEventListener('change', e => {
    const inp = e.target.closest('.start-inp');
    if (!inp) return;
    const sym = inp.dataset.sym;
    const firstMonth = firstBuyMonth(stockBySym.get(sym));
    if (!inp.value || (firstMonth && inp.value <= firstMonth)) {
      delete customStart[sym];   // 早于或等于最早买入月 = 恢复全区间
    } else {
      customStart[sym] = inp.value;
    }
    renderAll();
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    redrawChart(viewStocks());
  });
}

main().catch(e => {
  document.getElementById('params').textContent = '加载失败';
  showError(String(e.message || e));
});
</script>
</body>
</html>
