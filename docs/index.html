<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定投看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19;
      --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#e66767;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    max-width:1060px; margin:0 auto; padding:28px 20px 48px;
  }
  h1 { font-size:22px; font-weight:650; }
  .sub { color:var(--ink-2); font-size:13px; margin-top:6px; line-height:1.6; }
  .caveat { color:var(--muted); font-size:12px; margin-top:4px; }
  .error { color:var(--down); font-size:13px; margin-top:10px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
           gap:12px; margin:22px 0; }
  .tile { background:var(--surface); border:1px solid var(--ring); border-radius:10px;
          padding:14px 16px; }
  .tile .name { font-size:13px; color:var(--ink-2); display:flex; align-items:center; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .tile .ret { font-size:26px; font-weight:650; margin-top:6px; }
  .tile .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .card { background:var(--surface); border:1px solid var(--ring); border-radius:10px;
          padding:18px; margin:14px 0; }
  .card h2 { font-size:14px; font-weight:600; color:var(--ink-2); margin-bottom:12px; }
  .chart-wrap { position:relative; height:390px; }
  .tbl-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px;
          font-variant-numeric:tabular-nums; white-space:nowrap; }
  th { text-align:right; font-weight:600; color:var(--muted); font-size:12px;
       padding:7px 12px; border-bottom:1px solid var(--grid); }
  th:first-child, td:first-child { text-align:left; }
  td { text-align:right; padding:8px 12px; border-bottom:1px solid var(--grid); }
  tr:last-child td { border-bottom:none; }
  footer { color:var(--muted); font-size:12px; margin-top:18px; line-height:1.7; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { font-size:12px; padding:4px 11px; border-radius:999px;
          border:1px solid var(--grid); background:transparent; color:var(--ink-2);
          cursor:pointer; display:inline-flex; align-items:center; gap:6px;
          font-family:inherit; }
  .chip:hover { border-color:var(--baseline); }
  .chip.on { color:var(--ink); border-color:var(--baseline); font-weight:600; }
</style>
</head>
<body>
<h1>定投看板</h1>
<p class="sub" id="params">加载中…</p>
<p class="caveat">口径:复权收盘价(价格总回报近似)、允许碎股、零费用;美元标的按当日
USDCNY 汇率换算。数据仅供研究,非投资建议。</p>
<p class="error" id="error" hidden></p>

<div class="tiles" id="tiles"></div>

<div class="card">
  <h2>持仓市值走势(人民币)</h2>
  <p class="caveat" id="chart-note">点击标的名切换显示;颜色可辨识的上限是同时 5 条线,选第 6 只时会替换最早选中的。默认显示当前市值最大的 5 只。</p>
  <div class="chips" id="chips"></div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>

<div class="card">
  <h2>明细</h2>
  <div class="tbl-wrap"><table id="tbl">
    <thead><tr><th>标的</th><th>币种</th><th>起投</th><th>定投月数</th><th>累计投入</th>
    <th>当前市值</th><th>累计收益率</th><th>年化(XIRR)</th><th>数据截至</th></tr></thead>
    <tbody></tbody>
  </table></div>
</div>

<footer id="foot"></footer>

<script>
const COLOR_SLOTS = ['--s1','--s2','--s3','--s4','--s5'];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cny = v => Number.isFinite(v) ? '¥' + Math.round(v).toLocaleString('zh-CN') : '—';
const pct = v => Number.isFinite(v)
  ? (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%' : '—';
const cls = v => Number.isFinite(v) ? (v >= 0 ? 'up' : 'down') : '';
const monthOf = iso => iso.slice(0, 7);
let chart;

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = el.hidden ? msg : el.textContent + ' ' + msg;
  el.hidden = false;
}

function renderHeader(data, stocks) {
  document.title = `定投看板 · 每月${data.params.monthly_cny}元`;
  document.getElementById('params').textContent =
    `每月首个交易日定投 ¥${data.params.monthly_cny},起点 ${data.params.start},` +
    `共 ${Math.max(0, ...stocks.map(s => s.months))} 期`;
  document.getElementById('foot').textContent =
    `数据生成于 ${data.generated_at.replace('T', ' ').replace('+00:00', ' UTC')};` +
    `由 GitHub Actions 每月自动更新。标的清单见仓库 config/tickers.json。`;
}

function renderTiles(stocks) {
  document.getElementById('tiles').innerHTML = stocks.map(s => `
    <div class="tile">
      <div class="name">${esc(s.name)}
        <span style="color:var(--muted)">${esc(s.symbol)}</span></div>
      <div class="ret ${cls(s.cum_return)}">${pct(s.cum_return)}</div>
      <div class="meta">年化 ${pct(s.xirr)} · 市值 ${cny(s.value_cny)}</div>
    </div>`).join('');
}

function renderTable(stocks) {
  document.querySelector('#tbl tbody').innerHTML = stocks.map(s => `
    <tr><td>${esc(s.name)} ${esc(s.symbol)}</td><td>${esc(s.currency)}</td>
    <td>${esc((s.start ?? '').slice(0, 7) || '—')}</td>
    <td>${s.months}</td><td>${cny(s.invested)}</td><td>${cny(s.value_cny)}</td>
    <td class="${cls(s.cum_return)}">${pct(s.cum_return)}</td>
    <td class="${cls(s.xirr)}">${pct(s.xirr)}</td><td>${esc(s.as_of ?? '—')}</td></tr>`).join('');
}

const CHART_MAX_SERIES = COLOR_SLOTS.length;  // 超出调色板槽位数会不可辨识

// 走势图选择状态:selection 按选中顺序存 symbol,slotBySymbol 固定每只的颜色槽
// (颜色跟随标的,选中期间不变——过滤变化不重排幸存者的颜色)
let selection = [];
const slotBySymbol = {};

function freeSlot() {
  const used = new Set(Object.values(slotBySymbol));
  return COLOR_SLOTS.findIndex((_, i) => !used.has(i));
}

function toggleStock(sym, stocks) {
  if (selection.includes(sym)) {
    selection = selection.filter(s => s !== sym);
    delete slotBySymbol[sym];
  } else {
    if (selection.length >= CHART_MAX_SERIES) {
      delete slotBySymbol[selection.shift()];  // 替换最早选中的
    }
    slotBySymbol[sym] = freeSlot();
    selection.push(sym);
  }
  renderChips(stocks);
  redrawChart(stocks);
}

function renderChips(stocks) {
  document.getElementById('chips').innerHTML = stocks.map(s => {
    const on = selection.includes(s.symbol);
    const dot = on ? `<span class="dot" style="background:var(${COLOR_SLOTS[slotBySymbol[s.symbol]]})"></span>` : '';
    return `<button class="chip${on ? ' on' : ''}" data-sym="${esc(s.symbol)}">${dot}${esc(s.name)}</button>`;
  }).join('');
}

function redrawChart(stocks) {
  if (chart) { chart.destroy(); chart = null; }
  const shown = selection
    .map(sym => stocks.find(s => s.symbol === sym))
    .filter(Boolean);
  if (shown.length > 0) drawChart(shown);
}

function buildChartModel(stocks) {
  // 每只标的:买入日快照 + 用 as_of 当月的最新市值收尾,保证图表终点 = 汇总市值
  const valueMaps = stocks.map(s => {
    const m = Object.fromEntries(s.series.map(p => [monthOf(p[0]), p[1]]));
    if (s.as_of != null && Number.isFinite(s.value_cny)) m[monthOf(s.as_of)] = s.value_cny;
    return m;
  });
  const months = [...new Set(valueMaps.flatMap(m => Object.keys(m)))].sort();
  const invSource = stocks.reduce((a, s) => s.months > a.months ? s : a, stocks[0]);
  const invMap = Object.fromEntries(invSource.invested_series.map(p => [monthOf(p[0]), p[1]]));
  let last = null;
  const invested = months.map(k => (invMap[k] != null ? (last = invMap[k]) : last));
  return { months, values: valueMaps.map(m => months.map(k => m[k] ?? null)), invested };
}

function drawChart(stocks) {
  const { months, values, invested } = buildChartModel(stocks);
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: months,
      datasets: [
        ...stocks.map((s, i) => ({
          label: s.name, data: values[i],
          borderColor: css(COLOR_SLOTS[slotBySymbol[s.symbol] ?? i % COLOR_SLOTS.length]),
          backgroundColor: css(COLOR_SLOTS[slotBySymbol[s.symbol] ?? i % COLOR_SLOTS.length]),
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 12,
          spanGaps: true, tension: 0.1,
        })),
        {
          label: '累计投入', data: invested,
          borderColor: css('--baseline'), backgroundColor: css('--baseline'),
          borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 0,
          spanGaps: true,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: css('--ink-2'), usePointStyle: true,
                            pointStyle: 'line', boxHeight: 2 } },
        tooltip: {
          callbacks: { label: c => ` ${c.dataset.label}: ${cny(c.parsed.y)}` },
          itemSort: (a, b) => b.parsed.y - a.parsed.y,
        },
      },
      scales: {
        x: { ticks: { color: css('--muted'), maxTicksLimit: 12, maxRotation: 0 },
             grid: { display: false }, border: { color: css('--baseline') } },
        y: { ticks: { color: css('--muted'), callback: v => cny(v) },
             grid: { color: css('--grid') }, border: { display: false } },
      },
    },
  });
}

async function main() {
  const resp = await fetch('data.json?t=' + Date.now());
  if (!resp.ok) throw new Error(`data.json 加载失败(HTTP ${resp.status})`);
  const data = await resp.json();
  const stocks = data.stocks;
  if (!Array.isArray(stocks) || !data.params) throw new Error('data.json 结构不符合预期');

  if (stocks.length === 0) {
    document.getElementById('params').textContent = '没有配置任何标的';
    showError('标的清单为空:请在仓库 config/tickers.json 中添加股票后重新生成数据。');
    return;
  }

  renderHeader(data, stocks);
  renderTiles(stocks);
  renderTable(stocks);

  if (Array.isArray(data.failed) && data.failed.length > 0) {
    showError('以下标的本次取数失败,未纳入统计:' +
      data.failed.map(f => `${f.name} ${f.symbol}(${f.error})`).join(';'));
  }

  if (typeof Chart === 'undefined') {
    showError('图表库(CDN)加载失败,已跳过走势图;下方数据表不受影响。');
    return;
  }
  // 默认选中市值前 5;点击标签自由切换任意标的
  [...stocks].sort((a, b) => b.value_cny - a.value_cny)
    .slice(0, CHART_MAX_SERIES)
    .forEach(s => { slotBySymbol[s.symbol] = freeSlot(); selection.push(s.symbol); });
  renderChips(stocks);
  redrawChart(stocks);
  document.getElementById('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (chip) toggleStock(chip.dataset.sym, stocks);
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    redrawChart(stocks);
  });
}

main().catch(e => {
  document.getElementById('params').textContent = '加载失败';
  showError(String(e.message || e));
});
</script>
</body>
</html>
